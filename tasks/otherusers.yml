---
- name: Add users | create or remove users, shell, home dirs
  user:
    name: "{{ item.username }}"
    password: "{{ item.password | default(omit) }}"
    state: "{{ item.state | default('present') }}"
    remove: "{{ item.remove | default(false) }}"
    force: "{{ item.remove | default(false) }}"
    createhome: true
    append: true
    group: "{{ item.main_group | default(omit) }}"
    groups: "{{ item.groups | default([]) | join(',') }}"
    shell: "{{ first5user_default_shell }}"
    generate_ssh_key: false
    update_password: on_create
    comment: 'created by ansible'
  with_items: '{{ first5user_ssh_users }}'
  loop_control:
    label: "{{ item.username }}"
  no_log: true

- name: Setup other users | authorized key upload
  authorized_key:
    user: "{{ item.0.username }}"
    key: "{{ lookup('file', item.1.keyfile) }}"
    state: "{{ item.1.state | default('present') }}"
    manage_dir: true
  with_subelements:
    - "{{ first5user_ssh_users }}"
    - authorized
    - skip_missing: true
  when: item.0.state | default('present') == 'present'
  loop_control:
    label: "{{ item.0.username }} -> {{ item.1.name }}"
  become: true
  tags: [user, user_ssh_keys]

- name: Sudoers | remove legacy per-user entry from /etc/sudoers
  lineinfile:
    dest: /etc/sudoers
    mode: 0440
    regexp: '^{{ item.username | regex_escape }}\s'
    state: absent
    validate: 'visudo -cf %s'
  with_items: '{{ first5user_ssh_users }}'
  loop_control:
    label: "{{ item.username }}"

- name: Sudoers | remove legacy per-user Defaults from /etc/sudoers
  lineinfile:
    dest: /etc/sudoers
    mode: 0440
    regexp: '^Defaults:{{ item.username | regex_escape }}\s'
    state: absent
    validate: 'visudo -cf %s'
  with_items: '{{ first5user_ssh_users }}'
  loop_control:
    label: "{{ item.username }}"

# sudo ignores files in sudoers.d whose name contains a '.'
- name: Sudoers | per-user drop-in file
  copy:
    dest: "/etc/sudoers.d/{{ item.username | replace('.', '-') }}"
    content: |
      {{ item.username }} ALL=(ALL) NOPASSWD: ALL
      Defaults:{{ item.username }} !requiretty
    owner: root
    group: root
    mode: 0440
    validate: 'visudo -cf %s'
  with_items: '{{ first5user_ssh_users }}'
  loop_control:
    label: "{{ item.username }}"
  when:
    - item.state | default('present') == 'present'
    - item.use_sudo | default(false) | bool

- name: Sudoers | remove drop-in for absent or non-sudo users
  file:
    path: "/etc/sudoers.d/{{ item.username | replace('.', '-') }}"
    state: absent
  with_items: '{{ first5user_ssh_users }}'
  loop_control:
    label: "{{ item.username }}"
  when: not (item.state | default('present') == 'present' and item.use_sudo | default(false) | bool)
